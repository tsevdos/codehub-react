<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.0/babel.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" data-type="module" data-presets="react">
      import React from "https://esm.sh/react@19.2.0";
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client";
      const app = document.getElementById("app");
      const root = createRoot(app);

       const buttonStyles = {
        color: "#fff",
        background: "linear-gradient(135deg, #3057d5, #4d7cff)",
        border: "1px solid rgba(48, 87, 213, 0.2)",
        borderRadius: "14px",
        boxShadow: "0 12px 24px rgba(48, 87, 213, 0.28)",
        display: "inline-flex",
        fontWeight: 700,
        textDecoration: "none",
        transition: "transform 160ms ease, box-shadow 160ms ease",
        paddingInline: "18px",
      };

      const MyComponent = () => {
        return (
          <div className="container py-5">
            <h1 className="display-4 fw-bold mb-3 text-primary text-center text-lg-start">
              Hello, world!
            </h1>
            <div className="col-lg-8 mx-auto card border-0 shadow-lg rounded-4 overflow-hidden bg-body-tertiary p-4 p-md-5">
              <p className="fs-5 text-secondary mb-3 card-text">
                You've successfully loaded up the Bootstrap starter example. It
                includes <a href="https://getbootstrap.com/">Bootstrap 5</a> via
                the{" "}
                <a href="https://www.jsdelivr.com/package/npm/bootstrap">
                  jsDelivr CDN
                </a>{" "}
                and includes an additional CSS and JS file for your own code.
              </p>
              <p className="text-body-secondary mb-4 card-text">
                Feel free to download or copy-and-paste any parts of this
                example.
              </p>

              <div className="d-flex flex-wrap gap-3">
                <a
                  href="https://getbootstrap.com"
                  className="btn btn-primary btn-lg"
                  style={buttonStyles}
                >
                  Read the Bootstrap docs
                </a>
                <a
                  href="https://github.com/twbs/examples"
                  className="btn btn-outline-secondary btn-lg"
                >
                  View on GitHub
                </a>
              </div>
            </div>
          </div>
        );
      };

      root.render(<MyComponent />);
    </script>
  </body>
</html>
