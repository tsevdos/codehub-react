<html>
  <head></head>
  <body>
    <div id="app"></div>
    <script type="module">
      import React from "https://esm.sh/react@19.2.0";
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client";

      const app = document.getElementById("app");
      const root = createRoot(app);

      const element = React.createElement(
        "div",
        { className: "container" },
        "Hello World"
      );

      root.render(element);
    </script>
  </body>
</html>
