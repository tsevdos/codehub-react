<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.0/babel.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" data-type="module" data-presets="react">
      import React from "https://esm.sh/react@19.2.0";
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client";
      
      const app = document.getElementById("app");
      const root = createRoot(app);

      const Avatar = (props) => {
        return (
          <div>
            <h3>{props.username}</h3>
            <img width="100" src={props.imgUrl} />
            <p>My age is {props.age}</p>
            <p>My hobbies are:</p>
            <ul>
              {props.hobbies.map((hobbie) => (
                <li key={hobbie}>{hobbie}</li>
              ))}
            </ul>
            <p>
              I use {props.technologies.base} as a base and{" "}
              {props.technologies.library} for the rest
            </p>
            {props.isOlympiakos ? (
              <div>Ολυμπιακάρα</div>
            ) : (
              <div>Υπάρχουν και άλλες ομάδες;</div>
            )}
            <button onClick={props.handleClick}>Click me</button>
          </div>
        );
      };

      root.render(
        <Avatar
          username="tsevdos"
          age={44}
          imgUrl="https://pbs.twimg.com/profile_images/1170277252858372097/zj_tU1kT_400x400.jpg"
          isOlympiakos={true}
          hobbies={["coding", "football", "movies"]}
          technologies={{
            base: "TypeScript",
            library: "React",
          }}
          handleClick={() => console.log("Clicked!")}
        />
      );
    </script>
  </body>
</html>
